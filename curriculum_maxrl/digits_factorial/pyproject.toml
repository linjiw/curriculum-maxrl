[project]
name = "curriculum-maxrl-digits-factorial"
version = "0.1.0"
description = "Pinned CPU runtime for the source-locked Digits factorial"
requires-python = "==3.11.*"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.13.1",
  "scikit-learn==1.5.2",
  "torch==2.8.0",
]

[dependency-groups]
dev = [
  "pytest==8.3.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["../.."]
testpaths = ["tests"]
